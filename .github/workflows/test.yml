name: Command tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: agentux_test
          POSTGRES_USER: agentux
          POSTGRES_PASSWORD: agentux-test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agentux -d agentux_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      AGENTUX_COMMAND_TEST_DATABASE_URL: postgres://agentux:agentux-test@localhost:5432/agentux_test?sslmode=disable
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - run: node scripts/validate-bundle.mjs
