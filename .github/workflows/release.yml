name: Release

# A vX.Y.Z tag matching Cargo.toml (and the image the Quadlet pins) builds
# agentux-command and agentux-command-storage-report for x86_64 and aarch64,
# each on a native runner, and publishes them with SHA-256 sums as the
# GitHub release vX.Y.Z. The image ghcr.io/agentux-os/agentux-command:X.Y.Z
# comes from image.yml, which runs on the same tag. Running the workflow by
# hand builds the archives as artifacts without releasing.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: check version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          image=$(sed -n 's|^Image=ghcr.io/agentux-os/agentux-command:||p' deploy/quadlet/agentux-command.container)
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match Cargo.toml version $version"
            exit 1
          fi
          if [ "$image" != "$version" ]; then
            echo "::error::the Quadlet pins agentux-command:$image, Cargo.toml is $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    name: build (${{ matrix.arch }})
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    # Debian 12's glibc: the binaries run on it and anything newer
    # (Fedora, Ubuntu 24.04, the Command image).
    container: docker.io/library/rust:1.99-bookworm
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: cargo test --locked --release
      - name: Build
        run: cargo build --release --locked --bins
      - name: Package
        run: |
          name="agentux-command-${{ needs.check.outputs.version }}-${{ matrix.arch }}-linux"
          mkdir -p "dist/$name"
          cp target/release/agentux-command target/release/agentux-command-storage-report "dist/$name/"
          cp README.md "dist/$name/"
          cp -r deploy migrations "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          (cd dist && sha256sum "$name.tar.gz" > "$name.tar.gz.sha256")
          "dist/$name/agentux-command-storage-report" --help 2>&1 | grep -q usage
      - uses: actions/upload-artifact@v4
        with:
          name: agentux-command-${{ matrix.arch }}
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
          if-no-files-found: error

  release:
    name: publish release
    needs: [check, build]
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Verify checksums
        run: cd dist && sha256sum --check -- *.sha256
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          cat > notes.md <<EOF
          Container image: \`ghcr.io/agentux-os/agentux-command:$VERSION\` (amd64 and arm64), published by the image workflow for this tag. The Quadlet in \`deploy/quadlet/agentux-command.container\` pins it.

          The archives hold \`agentux-command\`, \`agentux-command-storage-report\`, the deploy bundle and the SQL migrations, built for Linux with glibc 2.36 or newer.
          EOF
          gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/*.sha256 \
            --repo "$GITHUB_REPOSITORY" --title "AgentUX Command $VERSION" \
            --notes-file notes.md --generate-notes --verify-tag
