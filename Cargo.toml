[package]
name = "agentux-command"
version = "0.1.1"
edition = "2024"
description = "AgentUX Command: the remote control plane for AgentUX nodes"
repository = "https://github.com/agentux-os/agentux-command"
publish = false

[dependencies]
# AUXP, shared with agentux-core's node gateway and tested against the
# protocol's schemas.
auxp = { git = "https://github.com/agentux-os/agentux-protocol", rev = "9c219eebb88b1bd74a275f8a17ba287031723d3c" }
async-trait = "0.1"
axum = { version = "0.8", features = ["ws"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
deadpool-postgres = "0.14"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
getrandom = "0.3"
hex = "0.4"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
subtle = "2"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-postgres = { version = "0.7", features = ["with-chrono-0_4", "with-serde_json-1"] }
url = "2"

[dev-dependencies]
# The real node side for tests/end_to_end.rs: agentux-core's gateway in
# front of an agentuxd with scripted agents.
agentux-gateway = { git = "https://github.com/agentux-os/agentux-core", rev = "da4a80ca27f89e56b166a29a40900191285fa74e" }
agentux-store = { git = "https://github.com/agentux-os/agentux-core", rev = "da4a80ca27f89e56b166a29a40900191285fa74e" }
agentuxd = { git = "https://github.com/agentux-os/agentux-core", rev = "da4a80ca27f89e56b166a29a40900191285fa74e" }
tempfile = "3"
http-body-util = "0.1"
tokio-tungstenite = "0.27"
tower = { version = "0.5", features = ["util"] }

[lints.rust]
unsafe_code = "forbid"
