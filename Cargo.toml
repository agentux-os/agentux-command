[package]
name = "agentux-command"
version = "0.1.1"
edition = "2024"
description = "AgentUX Command: the remote control plane for AgentUX nodes"
repository = "https://github.com/agentux-os/agentux-command"
publish = false

[dependencies]
# AUXP, shared with agentux-core's node gateway and tested against the
# protocol's schemas.
auxp = { git = "https://github.com/agentux-os/agentux-protocol", rev = "9155e4e6e661f7e1080428bda991fffb4ed54f9c" }
async-trait = "0.1"
base64 = "0.22"
axum = { version = "0.8", features = ["ws"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
deadpool-postgres = "0.14"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
getrandom = "0.3"
hex = "0.4"
# OIDC sign-in: ID token signatures, and the provider's endpoints.
jsonwebtoken = { version = "11", default-features = false, features = ["rust_crypto"] }
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
subtle = "2"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-postgres = { version = "0.7", features = ["with-chrono-0_4", "with-serde_json-1"] }
url = "2"

[dev-dependencies]
# The real node side for tests/end_to_end.rs: agentux-core's gateway in
# front of an agentuxd with scripted agents.
agentux-gateway = { git = "https://github.com/agentux-os/agentux-core", rev = "8876e26547af079dc957c8039260001df68838a5" }
agentux-store = { git = "https://github.com/agentux-os/agentux-core", rev = "8876e26547af079dc957c8039260001df68838a5" }
agentuxd = { git = "https://github.com/agentux-os/agentux-core", rev = "8876e26547af079dc957c8039260001df68838a5" }
tempfile = "3"
# Contract tests against agentux-protocol's schemas (auxp::schemas).
jsonschema = { version = "0.30", default-features = false }
# A test OIDC provider's signing key.
rsa = { version = "0.9", features = ["pem"] }
rand = "0.8"
jsonwebtoken = { version = "11", default-features = false, features = ["rust_crypto", "use_pem"] }
http-body-util = "0.1"
tokio-tungstenite = "0.27"
tower = { version = "0.5", features = ["util"] }

[lints.rust]
unsafe_code = "forbid"
